{% extends 'base.html' %} {% load static %} {% block content %}
<style>
  /* ===============================
     OTP SECTION & CARD STYLES
  =============================== */
  .otp-section {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .otp-card {
    width: 100%;
    max-width: 480px;
    background: rgba(17, 25, 40, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 35px 25px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    text-align: center;
    color: #fff;
  }

  .otp-card h2 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .otp-card p {
    color: #a0aec0;
    font-size: 14px;
    margin-bottom: 25px;
  }

  /* ===============================
     MESSAGES ALERT STYLES
  =============================== */
  .alert {
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
    text-align: center;
  }
  .alert-danger,
  .alert-error {
    background-color: rgba(239, 68, 68, 0.2);
    border: 1px solid #ef4444;
    color: #fca5a5;
  }
  .alert-success {
    background-color: rgba(34, 197, 94, 0.2);
    border: 1px solid #22c55e;
    color: #86efac;
  }

  /* ===============================
     OTP INPUT BOXES
  =============================== */
  .otp-wrapper {
    display: flex !important;
    flex-direction: row !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px !important;
    margin-bottom: 25px !important;
    width: 100% !important;
  }

  .otp-box {
    width: 48px !important;
    height: 55px !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    outline: none !important;
    border-radius: 10px !important;
    background: #141d36 !important;
    color: #ffffff !important;
    text-align: center !important;
    font-size: 22px !important;
    font-weight: 700 !important;
    transition: all 0.2s ease !important;
  }

  .otp-box:focus {
    border-color: #6c4cff !important;
    box-shadow: 0 0 12px #6c4cff !important;
    transform: translateY(-2px);
  }

  /* ===============================
     BUTTON STYLES
  =============================== */
  .verify-btn {
    width: 100% !important;
    padding: 13px !important;
    border: none !important;
    border-radius: 12px !important;
    font-size: 16px !important;
    font-weight: 600 !important;
    background: linear-gradient(90deg, #6c4cff, #3d7cff) !important;
    color: #fff !important;
    cursor: pointer;
    transition: 0.3s;
  }

  .verify-btn:hover {
    box-shadow: 0 8px 25px rgba(108, 76, 255, 0.4);
    transform: translateY(-2px);
  }

  .resend-link {
    display: inline-block;
    margin-top: 20px;
    color: #3d7cff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
  }

  .resend-link:hover {
    color: #6c4cff;
    text-decoration: underline;
  }

  /* ===============================
     MOBILE RESPONSIVE
  =============================== */
  @media (max-width: 480px) {
    .otp-wrapper {
      gap: 6px !important;
    }
    .otp-box {
      width: 38px !important;
      height: 48px !important;
      font-size: 18px !important;
    }
  }
</style>

<section class="otp-section">
  <div class="otp-card">
    <h2>OTP Verification</h2>
    <p>We have sent a 6-digit security code to your email.</p>

    {% if messages %} {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %} {% endif %}

    <form method="POST" id="otpForm">
      {% csrf_token %}

      <div class="otp-wrapper">
        <input
          type="text"
          maxlength="1"
          class="otp-box"
          inputmode="numeric"
          autofocus
        />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
      </div>

      <input type="hidden" name="otp" id="finalOTP" />

      <button type="submit" class="verify-btn">Verify OTP</button>
    </form>

    <a href="{% url 'resend_otp' %}" class="resend-link"
      >Didn't receive code? Resend OTP</a
    >
  </div>
</section>

<script>
  const inputs = document.querySelectorAll(".otp-box");
  const hidden = document.getElementById("finalOTP");

  function updateHiddenOTP() {
    let otp = "";
    inputs.forEach((i) => (otp += i.value));
    hidden.value = otp;
  }

  inputs.forEach((input, index) => {
    input.addEventListener("keyup", function (e) {
      if (this.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }

      if (e.key === "Backspace" && index > 0 && this.value === "") {
        inputs[index - 1].focus();
      }

      updateHiddenOTP();
    });

    input.addEventListener("paste", function (e) {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData)
        .getData("text")
        .trim();
      if (pasteData.length === 6 && !isNaN(pasteData)) {
        pasteData.split("").forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });
        inputs[5].focus();
        updateHiddenOTP();
      }
    });
  });
</script>
{% endblock %}
